name: Keep Render App Awake

on:
  schedule:
    # Every 25 minutes between 03:30 UTC and 18:30 UTC
    - cron: "*/25 3-18 * * *"
  workflow_dispatch: # allows manual run from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Check
        run: |
          curl -s https://interview-agent-backend.onrender.com/health
